trigger:
  - main

variables:
  - group: credentials-coordi-tools

pool:
  vmImage: ubuntu-latest

stages:
  - stage: resolve_version
    displayName: Resolve version
    jobs:
      - job: version
        steps:
          - checkout: self
          - bash: |
              full=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
              semver="${full%+*}"
              build="${full#*+}"
              echo "##vso[task.setvariable variable=FULL;isOutput=true]$full"
              echo "##vso[task.setvariable variable=SEMVER;isOutput=true]$semver"

  - stage: build
    displayName: Build platforms
    dependsOn: resolve_version
    variables:
      SEMVER: $[stageDependencies.resolve_version.version.outputs['v.SEMVER']]
    jobs:
      - job: linux
        displayName: Linux
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - bash: echo "$(GCP_SA_KEY)" | gcloud auth activate-service-account --key-file=-
          - bash: flutter config --enable-linux-desktop
          - bash: flutter pub get
          - bash: |
              sudo apt-get update -y
              sudo apt-get install -y clang cmake ninja-build pkg-config \
                libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev dpkg-dev
          - bash: flutter build linux --release
          - bash: |
              chmod +x build_deb.sh
              ./build_deb.sh $(SEMVER)
          - bash: |
              gsutil -h "Cache-Control:no-cache" cp \
                build/deb/coordi-vysor_$(SEMVER)_amd64.deb \
                gs://apkgoo/coordi-tools-mobile/linux/
            displayName: Upload .deb to GCS
          - bash: |
              BIN_NAME=$$(basename $$(find build/linux/x64/release/bundle -maxdepth 1 -type f -executable | head -1) || echo scrcpy_gui)
              cp "build/linux/x64/release/bundle/$BIN_NAME" \
                build/linux/x64/release/bundle/coordi-vysor-$(SEMVER)
              gsutil -h "Cache-Control:no-cache" cp \
                build/linux/x64/release/bundle/coordi-vysor-$(SEMVER) \
                gs://apkgoo/coordi-tools-mobile/linux/
            displayName: Upload raw binary to GCS

      - job: mac
        displayName: macOS
        pool:
          vmImage: macos-latest
        steps:
          - checkout: self
          - bash: echo "$(GCP_SA_KEY)" | gcloud auth activate-service-account --key-file=-
          - bash: flutter config --enable-macos-desktop
          - bash: flutter pub get
          - bash: cd macos && pod install
          - bash: flutter build macos --release
          - bash: |
              APP_PATH=$$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
              DMG_TMP=/tmp/coordi_dmg
              rm -rf "$$DMG_TMP" && mkdir -p "$$DMG_TMP"
              cp -R "$$APP_PATH" "$$DMG_TMP/"
              ln -s /Applications "$$DMG_TMP/Applications"
              hdiutil create -volname "Coordi Tools" -srcfolder "$$DMG_TMP" -ov -format UDZO \
                build/macos/Build/Products/Release/CoordiTools.dmg
              rm -rf "$$DMG_TMP"
              cp build/macos/Build/Products/Release/CoordiTools.dmg \
                build/macos/Build/Products/Release/coordi-vysor-macos-$(SEMVER).dmg
          - bash: |
              gsutil -h "Cache-Control:no-cache" cp \
                build/macos/Build/Products/Release/coordi-vysor-macos-$(SEMVER).dmg \
                gs://apkgoo/coordi-tools-mobile/mac/
            displayName: Upload .dmg to GCS

      - job: windows
        displayName: Windows
        pool:
          vmImage: windows-latest
        steps:
          - checkout: self
          - pwsh: |
              "$(GCP_SA_KEY)" | gcloud auth activate-service-account --key-file=-
          - pwsh: flutter config --enable-windows-desktop
          - pwsh: flutter pub get
          - pwsh: flutter build windows --release
          - pwsh: |
              $ver = "$(SEMVER)"
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" windows\installer.iss
              Copy-Item build/windows/installer/coordi-vysor-windows-setup.exe `
                build/windows/installer/coordi-vysor-windows-setup-$(SEMVER).exe
          - pwsh: |
              gsutil -h "Cache-Control:no-cache" cp `
                build/windows/installer/coordi-vysor-windows-setup-$(SEMVER).exe `
                gs://apkgoo/coordi-tools-mobile/windows/
            displayName: Upload .exe to GCS
          - pwsh: |
              $exe = Get-ChildItem build/windows/x64/runner/Release/*.exe | Where-Object { -not $_.Name.Contains('setup') -and -not $_.Name.Contains('Installer') } | Select-Object -First 1
              if (-not $exe) { $exe = Get-ChildItem build/windows/x64/runner/Release/scrcpy_gui.exe -ErrorAction SilentlyContinue }
              if (-not $exe) { $exe = Get-ChildItem build/windows/x64/runner/Release/coordi_tools.exe -ErrorAction SilentlyContinue }
              Copy-Item "$$exe" build/windows/x64/runner/Release/coordi-vysor-$(SEMVER).exe
              gsutil -h "Cache-Control:no-cache" cp `
                build/windows/x64/runner/Release/coordi-vysor-$(SEMVER).exe `
                gs://apkgoo/coordi-tools-mobile/windows/
            displayName: Upload raw binary to GCS

  - stage: publish_version
    displayName: Publish version.json
    dependsOn: build
    condition: succeeded()
    variables:
      FULL: $[stageDependencies.resolve_version.version.outputs['v.FULL']]
      SEMVER: $[stageDependencies.resolve_version.version.outputs['v.SEMVER']]
    jobs:
      - job: publish
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: echo "$(GCP_SA_KEY)" | gcloud auth activate-service-account --key-file=-
          - bash: |
              cat > version.json << EOF
              {
                "version": "$(FULL)",
                "platforms": {
                  "mac": "https://storage.googleapis.com/apkgoo/coordi-tools-mobile/mac/coordi-vysor-macos-$(SEMVER).dmg",
                  "windows": "https://storage.googleapis.com/apkgoo/coordi-tools-mobile/windows/coordi-vysor-windows-setup-$(SEMVER).exe",
                  "linux": "https://storage.googleapis.com/apkgoo/coordi-tools-mobile/linux/coordi-vysor_$(SEMVER)_amd64.deb"
                },
                "binaries": {
                  "mac": "https://storage.googleapis.com/apkgoo/coordi-tools-mobile/mac/coordi-vysor-macos-$(SEMVER).dmg",
                  "windows": "https://storage.googleapis.com/apkgoo/coordi-tools-mobile/windows/coordi-vysor-$(SEMVER).exe",
                  "linux": "https://storage.googleapis.com/apkgoo/coordi-tools-mobile/linux/coordi-vysor-$(SEMVER)"
                }
              }
              EOF
              gsutil -h "Cache-Control:no-cache" cp version.json \
                gs://apkgoo/coordi-tools-mobile/version.json
            displayName: Update version.json
