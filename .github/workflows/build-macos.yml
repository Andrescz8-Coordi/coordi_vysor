name: Build macOS

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install deps
        run: flutter pub get

      - name: Install CocoaPods
        run: cd macos && pod install

      - name: Build release
        run: flutter build macos --release

      - name: Package .dmg
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "Found app: $APP_PATH"
          SEMVER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          DMG_TMP=/tmp/coordi_dmg && rm -rf "$DMG_TMP" && mkdir -p "$DMG_TMP"
          cp -R "$APP_PATH" "$DMG_TMP/"
          ln -s /Applications "$DMG_TMP/Applications"
          hdiutil create -volname "Coordi Tools" -srcfolder "$DMG_TMP" -ov -format UDZO \
            build/macos/Build/Products/Release/CoordiTools.dmg
          rm -rf "$DMG_TMP"
          cp build/macos/Build/Products/Release/CoordiTools.dmg \
            build/macos/Build/Products/Release/coordi-vysor-macos-${SEMVER}.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coordi-vysor-macos
          path: build/macos/Build/Products/Release/coordi-vysor-macos-*.dmg
          retention-days: 30

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        run: |
          SEMVER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          gsutil -h "Cache-Control:no-cache" cp \
            build/macos/Build/Products/Release/coordi-vysor-macos-${SEMVER}.dmg \
            gs://apkgoo/coordi-tools-mobile/mac/

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/macos/Build/Products/Release/coordi-vysor-macos-*.dmg
          generate_release_notes: true
